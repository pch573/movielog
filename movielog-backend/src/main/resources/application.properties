spring.application.name=movielog-backend
spring.jpa.hibernate.ddl-auto=update

# 앞으로 local 프로필을 활성화합니다.
# Spring Boot는 application.properties를 읽은 후, application-local.properties를 덧씌워 읽게 됩니다.

spring.profiles.active=local

# MySQL Datasource (비밀번호 제외)
spring.datasource.username=movielog_user
spring.datasource.url=jdbc:mysql://localhost:3306/movielog?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 스프링 웹 관련 로그를 DEBUG 레벨로 설정하여 요청/응답 정보를 자세히 확인
logging.level.org.springframework.web=DEBUG

# 하이버네이트(JPA)가 실행하는 SQL 쿼리를 직접 보여줌
logging.level.org.hibernate.SQL=DEBUG

# SQL 쿼리의 ?에 바인딩되는 파라미터 값을 보여줌 (매우 유용)
logging.level.org.hibernate.type.descriptor.sql=TRACE

# JWT Settings
# 아래 비밀키는 32바이트(256비트) 이상의 랜덤 문자열이어야 합니다.

# 토큰 만료 시간 (1시간 = 3600000 밀리초)
jwt.token.expiration=3600000

# JPA 스키마 생성 후 데이터 초기화를 진행하도록 설정
spring.jpa.defer-datasource-initialization=true
# 데이터베이스 초기화를 항상 사용하도록 설정 (★★★★★ 가장 중요 ★★★★★)
spring.sql.init.mode=always
logging.level.root=INFO